<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>片刻 · 私人时光记录</title><link rel="stylesheet" href="style.css"><body>
<aside><div class="brand"><i>▧</i><div>片刻<small>MOMENTS</small></div></div><button class="gold write">＋　记录片刻</button><nav><button id="home" class="active">▤　我的信息流</button><button id="random">⤨　随机漫游</button></nav><footer>●　仅存储在此设备</footer></aside>
<main><header><div><div class="eyebrow">MY JOURNAL</div><h1>我的信息流<span>.</span></h1></div><input id="search" type="search" placeholder="⌕　搜索内容或标签" aria-label="搜索内容或标签"></header><section id="filters"></section><div class="layout"><section id="feed"></section><section class="rail"><article><div class="eyebrow">CALENDAR</div><h3>记录日历</h3><div class="month"><button id="prev">‹</button><b id="month"></b><button id="next">›</button></div><div id="calendar"></div><button id="resetDate" hidden>清除日期筛选 ×</button></article><article class="wander"><div class="eyebrow">REDISCOVER</div><div class="orbit">✧</div><h3>随机漫游</h3><p>翻开一个意想不到的片刻。</p><button id="wander">开始漫游　→</button></article></section></div></main>
<dialog id="editor"><form id="form"><h2>记录片刻</h2><label>内容形式<select id="kind"></select></label><label id="bodyLabel">正文<textarea id="bodyText" placeholder="此刻想记下什么？"></textarea></label><label id="fileLabel" hidden>选择本地文件<input id="file" type="file"></label><label id="answerLabel" hidden>参考答案<input id="answer"></label><label>标签<input id="tags" placeholder="用空格分隔"></label><p id="error"></p><div class="actions"><button type="button" id="cancel">取消</button><button class="gold">保存片刻</button></div></form></dialog><script src="app.js"></script></body></html>
